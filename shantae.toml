[[imm_override]]
bank = 4
addr = 0x4CDF
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4CE8
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D24
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D4E
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D90
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D99
note = "LD A,$00: cartridge RAM off"

