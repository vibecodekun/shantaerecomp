# Shantae (USA) - Game Boy Color, MBC5 + RAM + battery, 4 MiB (256 banks)
# Used with: gbrecompiled/build/bin/gbrecomp --config shantae.toml

[rom]
path = "roms/shantae.gbc"
# One level below the repo root so extras.c / game_build.cmake are picked up.
output_dir = "generated"
runtime_dir = "../gbrecompiled/runtime"
valid_crcs = [0xE994B59B]
# Curated routine names + candidate entry points (tools/gen_annotations.py).
annotations = "shantae.annotations"

[options]
# Native entry at every byte in every ROM bank, plus bank-zero alias and HALT bug.
exhaustive_rom = true
# Fast-path function discovery in historically identified code banks. Exhaustive
# native entries cover ALL banks regardless of this list. Routines reached only
# through computed jumps (script opcodes, JP-stub tables, object handlers) are
# compiled even if no test run has executed them. Spurious hits are harmless:
# dispatch is keyed on the exact (bank, PC) the CPU is at. The pointer probe
# (every bank-0 pointer x 255 banks) stays off -- far too slow on 4 MiB.
aggressive_scan = true
pointer_scan = false
scan_banks = [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x09, 0x0A, 0x0B, 0x0C,
              0x0D, 0x0E, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A,
              0x1B, 0x1C, 0x1D, 0x1E, 0x1F, 0x20, 0x21, 0x22, 0x23, 0x24, 0x25, 0x26,
              0x27, 0x33, 0x3D]
emit_comments = true
# RST $00 -> JP $3962: ADD A / POP HL / ... / JP HL, inline dw table after each RST.
jump_table_rst = [0x00]
# Seed every far-call target found by byte-scanning for CALL $0540/$056B/$0571.
scan_inline_calls = true
# Interrupt returns and frame boundaries resume at arbitrary PCs (e.g. HBlank
# STAT polling loops); give every compiled instruction a dispatch entry.
resumable_instructions = true

# CALL $0540 ; dw addr ; db bank -- far call, bank kept in HRAM $FF91,
# returns past the inline bytes via the bank-restore stub at $0564.
[[inline_call]]
routine = 0x0540

# CALL $056B ; dw addr ; db bank -- far jump after LD SP,$CFFF (scene changes).
[[inline_call]]
routine = 0x056B
no_return = true

# CALL $0571 ; dw addr ; db bank -- far jump keeping the stack.
[[inline_call]]
routine = 0x0571
no_return = true

# Palette loader (00:1C7A) GBA test: LDH A,($FE) / CP 3 / JR NZ. On GBA it adds
# $40 to the palette source (the brightened copy). extras.c overrides this
# immediate when "Original GBC colors" is on; other GBA checks are untouched.
[[imm_override]]
bank = 0
addr = 0x1CB6
note = "palette loader GBA check -> original GBC palettes on GBA"

# Sprite pipeline ("Reduce input lag" in extras.c). The VBlank handler streams
# the tick's sprite graphics (C4C0) to VRAM with an HBlank DMA, finished only by
# the end of the next picture, so 01:667C points the OAM DMA page at the previous
# tick's buffer. The hooks copy the fresh buffer instead, upload with a general
# DMA and move the sprites onto the committed scroll: sprites one frame sooner.
[[imm_override]]
bank = 0
addr = 0x0A50
note = "LD A,$07 before CALL $FF80: copy the buffer this tick wrote (hook only)"

[[imm_override]]
bank = 0
addr = 0x0A7D
note = "LD A,$CF (HBlank DMA of sprite graphics) -> $4F general DMA"

# Both camera routines (03:724D, 03:72EB) build the scroll from the camera and
# the background offset C9D2/C9D4, which bosses move later in the tick; the
# copy needs the offset the committed scroll was built with.
[[imm_override]]
bank = 3
addr = 0x730E
note = "AND $F8 after the scroll build: note the offset it used (hook only)"

# Movement after scripts ("Reduce input lag" in extras.c). Every loop calls the
# movement routines (00:0C45) and then the object scripts (00:1305). When the
# player's script picks a new movement routine (jump, walk, ...), it would first
# run in the next tick's 00:0C45; the hooks run it once right after the script.
[[imm_override]]
bank = 0
addr = 0x130B
note = "LD A,$03 in the script phase's prologue: note the player's movement routine (hook only)"

[[imm_override]]
bank = 0
addr = 0x1384
note = "ADD A,$7E, next object slot: run the player's new movement routine now (hook only)"

# The object table grown past 32 slots for the expanded view (object_slots.c):
# the loops that count slots take the table's size, and the unrolled movement
# pass stops before slot 31 so the slots past it move first. The object
# scripts step from slot 92 to A000 at 00:1384 (the ADD A,$7E above).
[[imm_override]]
bank = 1
addr = 0x4CD1
note = "LD A,$20: slots in the free list 01:4CB6 builds from D000 -> 93 with the view"

[[imm_override]]
bank = 1
addr = 0x4CFE
note = "LD A,$00 after 01:4CB6's loop: link slot 92 on to the slots at A000 (hook only)"

[[imm_override]]
bank = 0
addr = 0x1312
note = "LD E,$20: slots the object scripts (00:1305) visit -> the table's size"

[[imm_override]]
bank = 0
addr = 0x0C4B
note = "LD A,$03 in the movement pass (00:0C45): stop here to move the slots past 31 (hook only)"

# The collision node pool 01:711E builds in bank 7 (12 nodes at DD40) grows
# with the table: its free list goes on to the nodes at E000.
[[imm_override]]
bank = 1
addr = 0x7186
note = "LD A,$40 after 01:711E's loop: link the last node on to the nodes at E000 (hook only)"

# 09:480D gives an object (DE) a node, then clears the object's +$6B through
# BC, where 01:7192 left the node: another object's byte in bank 3.
[[imm_override]]
bank = 9
addr = 0x4880
note = "LD A,$00 before LD (HL),A: clear the object's +$6B, not the node's (hook only)"

# The expanded trigger can create the platform group before the doorway does.
[[imm_override]]
bank = 9
addr = 0x495A
note = "LD A,$01: keep platform-group creation idempotent and require eight free slots"

[[imm_override]]
bank = 9
addr = 0x499D
note = "LD A,$00: do not free an already-removed platform group"

# The save routines switch cartridge RAM on and off with interrupts disabled;
# the object slots at A000 step aside in between (hook only).
[[imm_override]]
bank = 4
addr = 0x4CA8
note = "LD A,$0A: cartridge RAM on (checksum)"

[[imm_override]]
bank = 4
addr = 0x4CF6
note = "LD A,$0A: cartridge RAM on (save)"

[[imm_override]]
bank = 4
addr = 0x4D30
note = "LD A,$0A: cartridge RAM on (erase)"

[[imm_override]]
bank = 4
addr = 0x4D5A
note = "LD A,$0A: cartridge RAM on (load)"

[[imm_override]]
bank = 4
addr = 0x4CDF
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4CE8
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D24
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D4E
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D90
note = "LD A,$00: cartridge RAM off"

[[imm_override]]
bank = 4
addr = 0x4D99
note = "LD A,$00: cartridge RAM off"

# "Smoother movement" (moveset.c): Shantae's own movement routines in bank 6.
# The whip routines zero her speed at +$41 with three LD A,0; the hooks give
# the speed she slides at instead.
[[imm_override]]
bank = 6
addr = 0x5E56
note = "LD A,$00 in the whip routine 06:5E52: her speed, low byte (and the tick's script changes)"

[[imm_override]]
bank = 6
addr = 0x5E59
note = "LD A,$00: the whip's speed, pixels"

[[imm_override]]
bank = 6
addr = 0x5E5C
note = "LD A,$00: the whip's speed, sign"

[[imm_override]]
bank = 6
addr = 0x6711
note = "LD A,$00 in the crouch whip routine 06:670D: her speed, low byte (and the tick's script changes)"

[[imm_override]]
bank = 6
addr = 0x6714
note = "LD A,$00: the crouch whip's speed, pixels"

[[imm_override]]
bank = 6
addr = 0x6717
note = "LD A,$00: the crouch whip's speed, sign"

# The jump (06:5520) and air whip (06:6CCD) routines read +$64 and take run
# speed when it is set: CP 0, JR NZ. With the hook B held is run speed.
[[imm_override]]
bank = 6
addr = 0x5637
note = "CP $00 on +$64, jump routine moving left: run speed while B is held"

[[imm_override]]
bank = 6
addr = 0x5663
note = "CP $00 on +$64, jump routine moving right"

[[imm_override]]
bank = 6
addr = 0x6D37
note = "CP $00 on +$64, air whip routine moving left"

[[imm_override]]
bank = 6
addr = 0x6D63
note = "CP $00 on +$64, air whip routine moving right"

# The crawl routine (06:648B) moves half a pixel a tick: $FFFF7F left, $000080
# right. With B held the hooks give walk speed.
[[imm_override]]
bank = 6
addr = 0x6575
note = "LD A,$7F: crawl speed left, low byte (and the crawl animation's rate)"

[[imm_override]]
bank = 6
addr = 0x6578
note = "LD A,$FF: crawl speed left, pixels"

[[imm_override]]
bank = 6
addr = 0x657B
note = "LD A,$FF: crawl speed left, sign"

[[imm_override]]
bank = 6
addr = 0x6595
note = "LD A,$80: crawl speed right, low byte (and the crawl animation's rate)"

[[imm_override]]
bank = 6
addr = 0x6598
note = "LD A,$00: crawl speed right, pixels"

[[imm_override]]
bank = 6
addr = 0x659B
note = "LD A,$00: crawl speed right, sign"

# LDH A,($8C) / AND 2 / CP 2 / JP Z: a new B press starts a whip. With "cancel"
# and a direction held the press is not seen, and she runs or crawls on.
[[imm_override]]
bank = 6
addr = 0x4AD6
note = "AND $02 on FF8C in the idle routine 06:4AA7: B pressed"

[[imm_override]]
bank = 6
addr = 0x509C
note = "AND $02 on FF8C in the walk routine 06:502A: B pressed"

[[imm_override]]
bank = 6
addr = 0x60EF
note = "AND $02 on FF8C in the crouch routine 06:6094: B pressed"

[[imm_override]]
bank = 6
addr = 0x64D3
note = "AND $02 on FF8C in the crawl routine 06:648B: B pressed"

# An air whip that lands resumes on the ground: script 06:5DCB, or 06:6681
# with Down held. With "cancel" and a direction held she runs or crawls on.
[[imm_override]]
bank = 6
addr = 0x6DA4
note = "LD A,$CB: low byte of the script an air whip lands in (06:5DCB)"

[[imm_override]]
bank = 6
addr = 0x6DA7
note = "LD A,$5D: its high byte"

[[imm_override]]
bank = 6
addr = 0x6DC3
note = "LD A,$81: low byte of the script an air whip lands in with Down held (06:6681)"

[[imm_override]]
bank = 6
addr = 0x6DC6
note = "LD A,$66: its high byte"

# A standing landing: the jump routine (06:5683) sets the landing script
# 06:59C2 over the air whip a new B set in the same tick, and that script plays
# 24 ticks of the landing routine 06:59E9, which tests a new A (LDH A,($8C) /
# AND 1 / CP 1 / JP Z to the jump script 06:5364) but never B or Select. With
# the hooks a new B is the whip script 06:5D61 and a new Select the dance script
# 0E:4179 in both, as in the idle routine.
[[imm_override]]
bank = 6
addr = 0x56BB
note = "LD A,$C2: low byte of the script a standing landing sets (06:59C2), or the whip's or the dance's"

[[imm_override]]
bank = 6
addr = 0x56BE
note = "LD A,$59: its high byte"

[[imm_override]]
bank = 6
addr = 0x56C1
note = "LD A,$06: its bank (0E for the dance)"

[[imm_override]]
bank = 6
addr = 0x5A0D
note = "AND $01 on FF8C in the landing routine 06:59E9: A pressed (or B for the whip, Select for the dance)"

[[imm_override]]
bank = 6
addr = 0x5A0F
note = "CP $01: the jump's branch (or the whip's, the dance's)"

[[imm_override]]
bank = 6
addr = 0x5A86
note = "LD A,$64: low byte of the script the landing's A starts (06:5364), or the whip's or the dance's"

[[imm_override]]
bank = 6
addr = 0x5A89
note = "LD A,$53: its high byte"

[[imm_override]]
bank = 6
addr = 0x5A8C
note = "LD A,$06: its bank (0E for the dance)"

# "Smoother movement" for the transformations (forms.c). The monkey's claw
# (0D:4FC8) and the tinkerbat's sword (1C:57AC) zero her speed like the whip.
[[imm_override]]
bank = 0x0D
addr = 0x4FCC
note = "LD A,$00 in the monkey's claw 0D:4FC8: her speed, low byte (and the tick's script changes)"

[[imm_override]]
bank = 0x0D
addr = 0x4FCF
note = "LD A,$00: the claw's speed, pixels"

[[imm_override]]
bank = 0x0D
addr = 0x4FD2
note = "LD A,$00: the claw's speed, sign"

[[imm_override]]
bank = 0x1C
addr = 0x57B0
note = "LD A,$00 in the tinkerbat's sword 1C:57AC: her speed, low byte (and the tick's script changes)"

[[imm_override]]
bank = 0x1C
addr = 0x57B3
note = "LD A,$00: the sword's speed, pixels"

[[imm_override]]
bank = 0x1C
addr = 0x57B6
note = "LD A,$00: the sword's speed, sign"

# Their jumps take run speed when +$64 is set: CP 0, JR NZ. With the hook B held is run speed.
[[imm_override]]
bank = 0x0D
addr = 0x4E48
note = "CP $00 on +$64, the monkey's jump moving left"

[[imm_override]]
bank = 0x0D
addr = 0x4E74
note = "CP $00 on +$64, the monkey's jump moving right"

[[imm_override]]
bank = 0x1C
addr = 0x5518
note = "CP $00 on +$64, the tinkerbat's fall and jump moving left"

[[imm_override]]
bank = 0x1C
addr = 0x5544
note = "CP $00 on +$64, the tinkerbat's fall and jump moving right"

[[imm_override]]
bank = 0x1C
addr = 0x5724
note = "CP $00 on +$64, the tinkerbat's air sword moving left"

[[imm_override]]
bank = 0x1C
addr = 0x5750
note = "CP $00 on +$64, the tinkerbat's air sword moving right"

# LDH A,($8C) / AND 2 / CP 2: a new B press attacks. With "cancel" and a direction held it is not seen.
[[imm_override]]
bank = 0x0D
addr = 0x4578
note = "AND $02 on FF8C in the monkey's idle 0D:4510: B pressed"

[[imm_override]]
bank = 0x0D
addr = 0x4894
note = "AND $02 on FF8C in the monkey's walk 0D:4840: B pressed"

[[imm_override]]
bank = 0x1C
addr = 0x4C43
note = "AND $02 on FF8C in the tinkerbat's idle 1C:4BDB: B pressed"

[[imm_override]]
bank = 0x1C
addr = 0x4E63
note = "AND $02 on FF8C in the tinkerbat's walk 1C:4E0F: B pressed"

# The harpy's talon (0D:751F) keeps her speed and ends in her idle (0D:6D3A),
# which zeroes it: with a direction held she keeps it into the run.
[[imm_override]]
bank = 0x0D
addr = 0x6D86
note = "LD A,$00 in the harpy's idle 0D:6D3A: her speed, low byte"

[[imm_override]]
bank = 0x0D
addr = 0x6D89
note = "LD A,$00: the harpy's idle speed, pixels"

[[imm_override]]
bank = 0x0D
addr = 0x6D8C
note = "LD A,$00: the harpy's idle speed, sign"

# "Dancing" (dance.c): quick steps. The dance routine 0E:4D40 ORs the held
# buttons into CB59 while a beat's window is open; with quick steps the window
# stays shut and each new press is a step, matched against 0E:4342 at once.
[[imm_override]]
bank = 0x0E
addr = 0x4260
note = "LD A,$01 in 0E:425D, the step ring's fill as a dance starts: clear the steps so far (hook only)"

[[imm_override]]
bank = 0x0E
addr = 0x4D48
note = "AND $04 on FF8C in the dance routine 0E:4D40: this tick's presses as steps (hook only)"

[[imm_override]]
bank = 0x0E
addr = 0x4D54
note = "CP $00 on slot+$18 in 0E:4D40: the beat's window is open -> never, with quick steps"

# Inline-argument routines: CALL routine ; <args> -- they read their arguments
# through the return address and resume past them. Lengths from
# tools/inline_args.py (straight-line HL increments before PUSH HL), plus two
# read by hand. The analyzer resumes after the arguments instead of decoding
# them as code.

# $0474: LD HL,SP+8 / ADD 4 to the return address -- dw ptr ; dw ptr.
[[inline_call]]
routine = 0x0474
arg_bytes = 4
far_target = false

# $1C7A load_palettes: 7-byte records {count, dw src, db bank, dw dst, db},
# repeated until a zero count byte (JP $1C7A loops back to its POP HL).
[[inline_call]]
routine = 0x1C7A
record_bytes = 7
far_target = false

[[inline_call]]  # 229 call sites
routine = 0x0803
arg_bytes = 8
far_target = false

[[inline_call]]  # 70 call sites
routine = 0x0FA2
arg_bytes = 1
far_target = false

[[inline_call]]  # 83 call sites
routine = 0x1B28
arg_bytes = 1
far_target = false

[[inline_call]]  # 2 call sites
routine = 0x1B40
arg_bytes = 1
far_target = false

