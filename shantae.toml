far_target = false

[[inline_call]]  # 10 call sites
routine = 0x235C
arg_bytes = 2
far_target = false

[[inline_call]]  # 24 call sites
routine = 0x2C4F
arg_bytes = 1
far_target = false

[[inline_call]]  # 24 call sites
routine = 0x2C6F
arg_bytes = 1
far_target = false

[[inline_call]]  # 38 call sites
routine = 0x2C8F
